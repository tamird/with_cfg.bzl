name: Check prepended list settings
on:
  push:
    branches: [qualification/prepend-list-setting]
permissions: {}
jobs:
  supplier:
    if: github.repository == 'tamird/with_cfg.bzl' && github.actor == github.repository_owner && github.event.created && !github.event.deleted && github.run_attempt == 1
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Bind the public supplier and native Bazel releases
        run: |
          set -euo pipefail
          w="$RUNNER_TEMP/prepend"
          mkdir -m 700 "$w" "$w/src"
          cd "$w/src"
          git init -q
          git fetch --no-tags --quiet --depth=3 https://github.com/tamird/with_cfg.bzl.git "$GITHUB_SHA"
          git checkout -q --detach FETCH_HEAD
          test "$(git rev-parse HEAD^)" = 01433cd771f82130524fd1a867fa995004b55ae3
          test "$(git rev-parse HEAD^^)" = 9b8b10962419346889e528cbe57a539754489d57
          test "$(git rev-parse 'HEAD^^{tree}')" = b9ae482808bcdc1c3d4a8ef571b4d61964c3ce8c
          git diff --exit-code HEAD^ HEAD -- . ':!.github/qualification/prepend.py' ':!.github/workflows/prepend-list.yml'
          cp .github/qualification/prepend.py "$w/"
          git switch -q --detach HEAD^
          test "$(cat .bazelversion)" = 9.2.0
          cd "$w"
          for v in 9.2.0 7.7.1; do
            curl --proto '=https' --proto-redir '=https' -fsSL --retry 2 "https://releases.bazel.build/$v/release/bazel-$v-linux-x86_64" -o "bazel-$v"
          done
          sha256sum -c <<'SUMS'
          115a1b62be95f29e5821d4dddffba1b058905a48019b499919c285e7f708d5e2  bazel-7.7.1
          7668a95db1250f12c40407251e4e203b4ec8bf39bc495d2f485b2d8c99048694  bazel-9.2.0
          SUMS
          chmod 755 bazel-7.7.1 bazel-9.2.0
      - name: Test repeated and empty prefixes, generated docs and canonical formatting
        run: |
          w="$RUNNER_TEMP/prepend"
          env -i HOME="$HOME" USER="$USER" PATH="$PATH" RUNNER_TEMP="$RUNNER_TEMP" LANG=C.UTF-8 python3 -IB "$w/prepend.py"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always() && !cancelled()
        with:
          name: supplier-prepend
          path: ${{ runner.temp }}/prepend/result.json
          if-no-files-found: error
          retention-days: 14
